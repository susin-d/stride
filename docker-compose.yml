services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stride_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: /app/start.sh

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stride_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
